<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0E16">
<title>The Rack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0E16; --raise:#181622; --panel:#1E1B2A; --hover:#262233;
  --line:#2E2940; --line-hi:#3D3654;
  --text:#EFEDF6; --muted:#918BA9; --dim:#5E5878;
  --violet:#8B7BFF; --mint:#4FDCA8; --warn:#FF8A5B; --amber:#FFB454;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-wrap:break-word;
}
h1,h2,h3,.dsp{font-family:"Space Grotesk",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px}
@media(min-width:900px){.wrap{padding:0 28px 64px}}

.top{
  position:sticky;top:0;z-index:20;background:rgba(15,14,22,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);margin-bottom:22px;
}
.top-in{
  max-width:1180px;margin:0 auto;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
@media(min-width:900px){.top-in{padding:16px 28px}}
.brand{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:none}
.stats{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);
  letter-spacing:.04em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
@media(max-width:520px){.stats{display:none}}
.pill{
  display:flex;align-items:center;gap:6px;flex:none;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:20px;padding:4px 10px;
}
.led{width:6px;height:6px;border-radius:50%;background:var(--mint);flex:none}
.led.warn{background:var(--amber)} .led.err{background:var(--warn)}
.led.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- layout ---------- */
.cols{display:grid;gap:22px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr;gap:26px;align-items:start}}
@media(min-width:1080px){.cols{grid-template-columns:1.05fr .95fr}}
.col{min-width:0}
@media(min-width:900px){.col-r{position:sticky;top:74px}}
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:0 2px 10px;
}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);
}

/* ---------- cards ---------- */
.card{
  background:var(--raise);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;transition:border-color .15s;
}
.card:hover{border-color:var(--line-hi)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 14px}
.card-head.tap{cursor:pointer;user-select:none}
.card-head.tap:hover{background:var(--hover)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.nm{
  font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:16px;
  flex:1;min-width:0;background:none;border:0;border-radius:5px;
  padding:3px 5px;margin-left:-5px;
}
.nm:hover{background:var(--hover)}
.nm:focus{outline:2px solid var(--violet);background:var(--hover)}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;
  color:var(--dim);flex:none;border:1px solid var(--line);border-radius:5px;padding:3px 7px;
}
.tag.on{color:var(--mint);border-color:rgba(79,220,168,.3)}

.card.console{border-left-width:3px}
.chead{border-bottom:1px solid var(--line)}
.ps{flex:none}
.nm.own{font-weight:600;font-size:16.5px;letter-spacing:-.01em}
.sfx{
  font-family:"Space Grotesk",sans-serif;font-size:16.5px;font-weight:600;
  color:var(--dim);flex:none;margin-left:-3px;letter-spacing:-.01em;
}
.gap{flex:1}
.own-b{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px;
}
.bay.guide{position:relative;padding-left:26px}
.bay.guide::before{
  content:"";position:absolute;left:13px;top:6px;bottom:6px;
  width:1px;background:var(--line);
}
.bay.guide .row-t{font-size:13.5px;color:var(--muted)}
.bay.guide .row-t b{color:var(--text);font-weight:600}

.bay{padding:0 14px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-t{flex:1;min-width:0;font-size:14px}
.row-t b{font-weight:600}
.sub{color:var(--dim);font-size:12.5px}
.row .mono{font-size:11px;color:var(--dim);flex:none}
.ghost-row .row-t{color:var(--warn)}
.ghost-row .dot{background:var(--warn);opacity:.45}
.blank{padding:14px 0 15px;color:var(--dim);font-size:13.5px}
.card-foot{padding:11px 14px;border-top:1px solid var(--line)}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:var(--panel);border-radius:7px;
  padding:8px 13px;font-size:13.5px;font-weight:500;transition:.13s;
}
.btn:hover{border-color:var(--line-hi);background:var(--hover)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-pri{background:var(--violet);border-color:var(--violet);color:#100E1A;font-weight:600}
.btn-pri:hover:not(:disabled){background:#9E90FF;border-color:#9E90FF}
.btn-q{background:none;border-color:transparent;color:var(--muted)}
.btn-q:hover{color:var(--text);background:var(--hover);border-color:transparent}
.btn-s{padding:5px 10px;font-size:12.5px}
.btn-w{width:100%;justify-content:center}

/* ---------- search ---------- */
.searchbox{position:relative;margin-bottom:10px}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.4}
input.field{
  width:100%;background:var(--raise);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;font-size:15px;transition:border-color .15s;
}
input.field::placeholder{color:var(--dim)}
input.field:focus{outline:none;border-color:var(--violet)}
input.pad{padding-left:38px}
.kbd{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim);
  border:1px solid var(--line);border-radius:4px;padding:2px 5px;pointer-events:none;
}
@media(max-width:899px){.kbd{display:none}}

.hit{
  background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--violet);
  border-radius:var(--r);padding:12px 14px;margin-bottom:8px;
}
.hit-t{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:15.5px}
.hit-o{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:4px}
.hit-w{font-size:13.5px;margin-top:7px}
.hit-w b{font-weight:600;color:var(--mint)}
.hit-x{font-size:12.5px;color:var(--warn);margin-top:6px}
.void{
  border:1px dashed var(--line);border-radius:var(--r);
  padding:20px 14px;color:var(--dim);font-size:13.5px;text-align:center;
}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0}
.chip{
  display:inline-flex;align-items:center;gap:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-size:12.5px;
}
.chip button{color:var(--dim);padding:0 4px;font-size:16px;line-height:1;border-radius:50%}
.chip button:hover{color:var(--warn)}
.addrow{display:flex;gap:8px;padding:0 0 13px}
.addrow .field{flex:1;padding:9px 12px;font-size:14px}

/* ---------- alerts ---------- */
.alert{
  background:linear-gradient(180deg,rgba(255,138,91,.09),rgba(255,138,91,.03));
  border:1px solid rgba(255,138,91,.28);border-radius:var(--r);
  padding:13px 14px;margin-bottom:10px;
}
.alert h3{font-size:14.5px;color:var(--warn);margin-bottom:4px}
.alert p{font-size:13.5px;color:var(--text);margin-bottom:10px}
.alert ol{margin:0 0 12px 17px;font-size:13px;color:var(--muted)}
.alert li{margin-bottom:5px}
.alert li b{color:var(--text)}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(6,5,12,.7);
  backdrop-filter:blur(3px);display:flex;padding:14px;
  align-items:flex-end;justify-content:center;
}
@media(min-width:700px){.scrim{align-items:center}}
.modal{
  background:var(--raise);border:1px solid var(--line-hi);border-radius:14px;
  width:100%;max-width:460px;max-height:86vh;overflow-y:auto;padding:20px 18px 18px;
  animation:rise .18s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal h2{font-size:19px;margin-bottom:3px}
.modal .lede{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--panel);border-radius:8px;
  padding:12px 13px;margin-bottom:7px;font-size:14.5px;transition:.13s;
}
.opt:hover:not(:disabled){border-color:var(--line-hi)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt.on{border-color:var(--violet);background:rgba(139,123,255,.13)}
.opt .mono{margin-left:auto;font-size:11px;color:var(--dim)}
.gate{border:1px solid var(--line);border-radius:8px;padding:13px;margin-top:15px;background:rgba(255,138,91,.05)}
.gate p{font-size:13.5px;font-weight:600;margin-bottom:10px}
.pair{display:flex;gap:8px}
.pair .btn{flex:1}
.yes{border-color:var(--mint);background:rgba(79,220,168,.13);color:var(--mint)}
.no{border-color:var(--warn);background:rgba(255,138,91,.13);color:var(--warn)}
.tip{font-size:12.5px;color:var(--warn);margin-top:10px}
.acts{display:flex;gap:8px;margin-top:18px}
.acts .btn{flex:1}

/* ---------- misc ---------- */
details{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
summary{cursor:pointer;font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:14.5px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--dim);font-family:"IBM Plex Mono",monospace}
details[open] summary::after{content:"–"}
details ol{margin:13px 0 2px 17px;font-size:13.5px;color:var(--muted)}
details li{margin-bottom:7px}
details li b{color:var(--text);font-weight:600}
.log{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);padding:7px 0;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:0}
.log span{color:var(--dim)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <span class="brand dsp">The Rack</span>
  <span class="stats" id="stats"></span>
  <span class="pill" id="pill"></span>
</div></header>

<div class="wrap"><div id="app"></div></div>

<script>
(function(){
/* ==========================================================
   CONFIG — paste your publishable key. Safe to be public
   with RLS on (see SETUP.md). Nothing else needs editing.
   ========================================================== */
var SUPABASE_URL = "https://dxooxfhtqumivvufqjzz.supabase.co";
var SUPABASE_KEY = "sb_publishable_9y3970eZYd5JPldVM6QwBQ_wbzgyhpV";        // sb_publishable_...
var BOARD_ID     = "rack";
/* ========================================================== */

var LOCAL = "psrack:v3";
var PALETTE = ["#4FDCA8","#FF6B8A","#8B7BFF","#F26BC8","#4CC9F0","#FFB454","#7DD3FC","#C4B5FD"];

var S=null, sheet=null, q="", openLib=null, sync="boot", busy=false;

/* ---------- model ---------- */
function seed(){
  return {
    members:[1,2,3,4,5].map(function(n,i){
      return {id:"m"+n,name:"Player "+n,color:PALETTE[i],games:[]};
    }),
    activation:{}, since:{}, stale:[], log:[]
  };
}
function normalize(s){
  if(!s||!s.members) return seed();
  s.members=s.members.map(function(m){return m.games?m:Object.assign({},m,{games:[]})});
  return s;
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function now(){return new Date().toISOString()}
function fmt(t){return t?new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"}):""}
function ago(t){if(!t)return"";var d=Math.floor((Date.now()-new Date(t))/864e5);return d?d+"d":"today"}
function cmp(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1}
function tint(hex,a){
  var n=parseInt(hex.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
function mem(id){for(var i=0;i<S.members.length;i++)if(S.members[i].id===id)return S.members[i];return null}
function nm(id){var m=mem(id);return m?m.name:"—"}
function occ(cid){return S.members.filter(function(m){return S.activation[m.id]===cid})}
function ghosts(cid){return S.stale.filter(function(s){return s.consoleId===cid})}
function reach(oid){var o=[oid],a=S.activation[oid];if(a&&a!==oid)o.push(a);return o}
function blocked(oid){return S.stale.some(function(s){return s.memberId===oid})}
function totalGames(){return S.members.reduce(function(n,m){return n+m.games.length},0)}
function placed(){return S.members.filter(function(m){var a=S.activation[m.id];return a&&a!==m.id}).length}

/* ---------- storage ---------- */
function live(){return !!(SUPABASE_URL&&SUPABASE_KEY)}
function api(path,opt){
  opt=opt||{};
  var h={apikey:SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=representation"};
  // publishable keys go on apikey only; legacy anon keys also want Bearer
  if(SUPABASE_KEY.indexOf("sb_")!==0) h.Authorization="Bearer "+SUPABASE_KEY;
  return fetch(SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/"+path,{method:opt.method||"GET",headers:h,body:opt.body})
    .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(r.status+" "+t)});return r});
}
async function pull(){
  var r=await api("boards?id=eq."+encodeURIComponent(BOARD_ID)+"&select=data");
  var rows=await r.json();
  if(!rows.length){var f=seed();await api("boards",{method:"POST",body:JSON.stringify({id:BOARD_ID,data:f})});return f}
  return normalize(rows[0].data);
}
async function save(next){
  S=next;
  if(!live()){sync="local";draw();try{localStorage.setItem(LOCAL,JSON.stringify(next))}catch(e){}return}
  sync="saving";draw();busy=true;
  try{
    await api("boards?id=eq."+encodeURIComponent(BOARD_ID),
      {method:"PATCH",body:JSON.stringify({data:next,updated_at:now()})});
    sync="ok";
  }catch(e){sync="err"}
  busy=false;draw();
}
async function poll(){
  if(!live()||busy||sheet)return;
  try{
    var r=await pull();
    if(JSON.stringify(r)!==JSON.stringify(S)){S=r;draw()}
    if(sync==="err"){sync="ok";draw()}
  }catch(e){sync="err";draw()}
}
function logged(s,t){return Object.assign({},s,{log:[{ts:now(),text:t}].concat(s.log).slice(0,60)})}

/* ---------- actions ---------- */
function commit(aid,cid,released){
  var prev=S.activation[aid]||null, stale=S.stale.slice();
  if(prev&&prev!==cid&&!released)
    stale.push({id:"s"+Date.now(),memberId:aid,consoleId:prev,ts:now()});
  stale=stale.filter(function(s){return !(s.memberId===aid&&s.consoleId===cid)});
  var act=Object.assign({},S.activation);act[aid]=cid;
  var sn=Object.assign({},S.since);sn[aid]=now();
  var msg=prev
    ? nm(cid)+"\u2019s PS5 took "+nm(aid)+"\u2019s PSN"+(released?" (released from "+nm(prev)+")":" \u2014 NOT released from "+nm(prev))
    : nm(cid)+"\u2019s PS5 activated "+nm(aid)+"\u2019s PSN";
  sheet=null;
  save(logged(Object.assign({},S,{activation:act,since:sn,stale:stale}),msg));
}
function release(aid,cid){
  var act=Object.assign({},S.activation);act[aid]=null;
  var sn=Object.assign({},S.since);sn[aid]=null;
  save(logged(Object.assign({},S,{activation:act,since:sn}),nm(cid)+"\u2019s PS5 released "+nm(aid)+"\u2019s PSN"));
}
function clearGhost(id){
  var g=null;S.stale.forEach(function(s){if(s.id===id)g=s});
  if(!g)return;
  save(logged(Object.assign({},S,{stale:S.stale.filter(function(s){return s.id!==id})}),
    "Ghost cleared on "+nm(g.consoleId)+"\u2019s PS5 ("+nm(g.memberId)+"\u2019s PSN)"));
}
function rename(id,v){
  save(Object.assign({},S,{members:S.members.map(function(m){
    return m.id===id?Object.assign({},m,{name:v||"Unnamed"}):m})}));
}
function addGames(oid,raw){
  var inc=raw.split(",").map(function(g){return g.trim()}).filter(Boolean);
  if(!inc.length)return;
  var have=mem(oid).games.map(function(g){return g.toLowerCase()}), add=[];
  inc.forEach(function(g){if(have.indexOf(g.toLowerCase())<0){add.push(g);have.push(g.toLowerCase())}});
  if(!add.length)return;
  save(logged(Object.assign({},S,{members:S.members.map(function(m){
    return m.id===oid?Object.assign({},m,{games:m.games.concat(add).sort(cmp)}):m})}),
    nm(oid)+"\u2019s PSN +"+(add.length===1?add[0]:add.length+" games")));
}
function dropGame(oid,t){
  save(logged(Object.assign({},S,{members:S.members.map(function(m){
    return m.id===oid?Object.assign({},m,{games:m.games.filter(function(g){return g!==t})}):m})}),
    nm(oid)+"\u2019s PSN \u2212"+t));
}
function search(v){
  v=v.trim().toLowerCase();if(!v)return[];
  var out=[];
  S.members.forEach(function(m){m.games.forEach(function(g){
    if(g.toLowerCase().indexOf(v)>=0)out.push({o:m,t:g})})});
  return out.sort(function(a,b){return cmp(a.t,b.t)});
}
function addMember(){
  if(S.members.length>=8)return;
  var n=S.members.length+1;
  save(Object.assign({},S,{members:S.members.concat([
    {id:"m"+Date.now(),name:"Player "+n,color:PALETTE[(n-1)%PALETTE.length],games:[]}])}));
}
function reset(){if(confirm("Wipe the board for everyone?"))save(seed())}

/* ---------- render ---------- */
function drawChrome(){
  var st=document.getElementById("stats"), p=document.getElementById("pill");
  if(!S){st.textContent="";p.innerHTML='<span class="led warn"></span>Loading';return}
  st.textContent=S.members.length+" PS5s \u00b7 "+placed()+" shared \u00b7 "+totalGames()+" games";
  var cls="led live",txt="Live";
  if(!live()){cls="led warn";txt="Local"}
  else if(sync==="err"){cls="led err";txt="Offline"}
  else if(sync==="saving"){cls="led warn";txt="Saving"}
  p.innerHTML='<span class="'+cls+'"></span>'+txt;
}

function consoleCard(c){
  var o=occ(c.id), g=ghosts(c.id), h="";
  h+='<div class="card console" style="border-left-color:'+c.color+'">'
   + '<div class="card-head chead" style="background:linear-gradient(90deg,'+tint(c.color,.16)+',transparent 65%)">'
   + '<svg class="ps" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="'+c.color+'" stroke-width="2" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="3"/><path d="M7 12h2M8 11v2M16 12h.01"/></svg>'
   + '<input class="nm own" value="'+esc(c.name)+'" size="'+Math.max(4,c.name.length)+'" data-a="rn" data-id="'+c.id+'" aria-label="PS5 owner">'
   + '<span class="sfx">\u2019s PS5</span><span class="gap"></span>'
   + '<span class="tag'+(o.length?" on":"")+'">'+o.length+' PSN</span></div>';
  h+='<div class="bay guide">';
  if(!o.length&&!g.length) h+='<div class="blank">No PSN accounts activated.</div>';
  o.forEach(function(a){
    h+='<div class="row"><span class="dot" style="background:'+a.color+'"></span>'
     + '<span class="row-t"><b>'+esc(a.name)+"</b>\u2019s PSN"
     + (a.id===c.id?' <span class="own-b">own</span>':"")
     + (a.games.length?' <span class="sub">· '+a.games.length+"</span>":"")+"</span>"
     + '<span class="mono">'+ago(S.since[a.id])+"</span>"
     + '<button class="btn btn-q btn-s" data-a="rel" data-acc="'+a.id+'" data-con="'+c.id+'">Release</button></div>';
  });
  g.forEach(function(s){
    h+='<div class="row ghost-row"><span class="dot"></span>'
     + '<span class="row-t"><b>'+esc(nm(s.memberId))+"</b>\u2019s PSN · ghost claim</span>"
     + '<button class="btn btn-q btn-s" data-a="gx" data-id="'+s.id+'">Clear</button></div>';
  });
  h+='</div><div class="card-foot">'
   + '<button class="btn btn-pri btn-w" data-a="open" data-con="'+c.id+'">Activate a PSN account</button></div></div>';
  return h;
}

function libCard(m){
  var open=openLib===m.id, h="";
  h+='<div class="card"><div class="card-head tap" data-a="lib" data-id="'+m.id+'">'
   + '<span class="dot" style="background:'+m.color+'"></span>'
   + '<span class="nm dsp">'+esc(m.name)+"\u2019s PSN</span>"
   + '<span class="tag">'+m.games.length+(open?" \u25be":" \u25b8")+"</span></div>";
  if(open){
    h+='<div class="bay">';
    h+='<div class="row" style="border:0;padding:11px 0 3px"><span class="sub">Playable on '
     + reach(m.id).map(function(c){return esc(nm(c))+"\u2019s PS5"}).join(" and ")+"</span></div>";
    if(!m.games.length) h+='<div class="blank">Nothing listed yet.</div>';
    else{
      h+='<div class="chips">';
      m.games.forEach(function(g){
        h+='<span class="chip">'+esc(g)+'<button data-a="gdel" data-id="'+m.id
         + '" data-g="'+esc(g)+'" aria-label="Remove '+esc(g)+'">×</button></span>';
      });
      h+="</div>";
    }
    h+='<div class="addrow"><input class="field" placeholder="Add titles, comma separated" data-a="gin" data-id="'+m.id+'" autocomplete="off">'
     + '<button class="btn btn-pri" data-a="gadd" data-id="'+m.id+'">Add</button></div></div>';
  }
  h+="</div>";
  return h;
}

function modal(){
  var cid=sheet.con, pick=sheet.acc;
  var prev=pick?(S.activation[pick]||null):null;
  var moving=!!(pick&&prev&&prev!==cid);
  var ok=!!pick&&(!moving||sheet.rel!==null);
  var h='<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true">'
   + "<h2>"+esc(nm(cid))+"\u2019s PS5</h2>"
   + '<p class="lede">Whose PSN account is this PS5 taking?</p>';
  S.members.forEach(function(a){
    var at=S.activation[a.id]||null;
    var tail=at===cid?"here":at?"on "+nm(at)+"\u2019s PS5":"free";
    h+='<button class="opt'+(pick===a.id?" on":"")+'" data-a="pick" data-id="'+a.id+'"'+(at===cid?" disabled":"")+">"
     + '<span class="dot" style="background:'+a.color+'"></span>'+esc(a.name)+"\u2019s PSN"
     + '<span class="mono">'+esc(tail)+"</span></button>";
  });
  if(moving){
    h+='<div class="gate"><p>Did '+esc(nm(prev))+"\u2019s PS5 turn console sharing off first?</p><div class=\"pair\">"
     + '<button class="btn'+(sheet.rel===true?" yes":"")+'" data-a="rel1">Yes</button>'
     + '<button class="btn'+(sheet.rel===false?" no":"")+'" data-a="rel0">No / unsure</button></div>'
     + (sheet.rel===false?'<p class="tip">Raises a ghost claim on '+esc(nm(prev))+"\u2019s PS5.</p>":"")
     + "</div>";
  }
  h+='<div class="acts"><button class="btn" data-a="x">Cancel</button>'
   + '<button class="btn btn-pri" data-a="go"'+(ok?"":" disabled")+">Log it</button></div></div></div>";
  return h;
}

function draw(){
  drawChrome();
  var app=document.getElementById("app");
  if(!S){app.innerHTML='<div class="void">Loading…</div>';return}
  var h="";

  if(S.stale.length){
    S.stale.forEach(function(s){
      h+='<div class="alert"><h3>'+esc(nm(s.consoleId))+"\u2019s PS5 never released "+esc(nm(s.memberId))+"\u2019s PSN</h3>"
       + "<p>"+esc(nm(s.memberId))+" may be locked out of their own games until this clears.</p><ol>"
       + "<li><b>"+esc(nm(s.memberId))+":</b> Settings \u2192 Users and Accounts \u2192 Other \u2192 Restore Licenses</li>"
       + "<li>Full shutdown, not rest mode</li>"
       + "<li>Still stuck? <b>"+esc(nm(s.consoleId))+"</b> signs in and turns sharing off</li></ol>"
       + '<button class="btn btn-s" data-a="gx" data-id="'+s.id+'">Mark cleared</button></div>';
    });
  }

  h+='<div class="cols"><div class="col">';
  h+='<div class="sec-head"><span class="eyebrow">PS5s</span></div>';
  S.members.forEach(function(c){h+=consoleCard(c)});
  h+='<div class="foot"><button class="btn btn-q btn-s" data-a="madd">Add person</button>'
   + '<button class="btn btn-q btn-s" data-a="wipe">Reset</button></div>';
  h+="</div>";

  h+='<div class="col col-r">';
  h+='<div class="sec-head"><span class="eyebrow">Find a game</span></div>';
  h+='<div class="searchbox">'
   + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
   + '<input id="qbox" class="field pad" placeholder="Search the pool" value="'+esc(q)+'" data-a="q" autocomplete="off">'
   + (q?"":'<span class="kbd">/</span>')+"</div>";
  if(q.trim()){
    var hits=search(q);
    if(!hits.length) h+='<div class="void">Nobody has it. Someone should buy it.</div>';
    else hits.slice(0,40).forEach(function(x){
      var w=reach(x.o.id);
      h+='<div class="hit"><div class="hit-t">'+esc(x.t)+"</div>"
       + '<div class="hit-o"><span class="dot" style="background:'+x.o.color+'"></span>'+esc(x.o.name)+"\u2019s PSN</div>"
       + '<div class="hit-w">Play on '+w.map(function(c){return "<b>"+esc(nm(c))+"\u2019s PS5</b>"}).join(" and ")+"</div>"
       + (blocked(x.o.id)?'<div class="hit-x">Ghost claim open \u2014 their own PS5 may be locked.</div>':"")
       + "</div>";
    });
  }
  h+='<div class="sec-head" style="margin-top:22px"><span class="eyebrow">PSN libraries</span></div>';
  S.members.forEach(function(m){h+=libCard(m)});

  h+="<details><summary>Rules of the rack</summary><ol>"
   + "<li><b>Release first, activate second.</b></li>"
   + "<li><b>Log it here</b> as it happens.</li>"
   + "<li><b>Full shutdown</b> the old console. Rest mode keeps the claim alive.</li>"
   + "<li><b>Restore Licenses</b> fixes most lockouts.</li>"
   + "<li><b>Deactivate All</b> on the PSN site works once every 6 months. Last resort.</li>"
   + "</ol></details>";
  h+="<details><summary>Activity</summary>";
  h+=S.log.length?S.log.map(function(l){return '<div class="log"><span>'+fmt(l.ts)+"</span> "+esc(l.text)+"</div>"}).join("")
    :'<div class="blank">Nothing yet.</div>';
  h+="</details>";
  h+="</div></div>";

  if(sheet)h+=modal();
  app.innerHTML=h;

  if(q){var b=document.getElementById("qbox");
    if(b&&document.activeElement!==b){b.focus();b.setSelectionRange(b.value.length,b.value.length)}}
}

/* ---------- events ---------- */
var app=document.getElementById("app");
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=t.getAttribute("data-a");
  if(a==="open"){sheet={con:t.getAttribute("data-con"),acc:null,rel:null};draw()}
  else if(a==="pick"){sheet.acc=t.getAttribute("data-id");sheet.rel=null;draw()}
  else if(a==="rel1"){sheet.rel=true;draw()}
  else if(a==="rel0"){sheet.rel=false;draw()}
  else if(a==="go"){commit(sheet.acc,sheet.con,sheet.rel===true)}
  else if(a==="x"){sheet=null;draw()}
  else if(a==="scrim"){if(e.target===t){sheet=null;draw()}}
  else if(a==="rel"){release(t.getAttribute("data-acc"),t.getAttribute("data-con"))}
  else if(a==="gx"){clearGhost(t.getAttribute("data-id"))}
  else if(a==="lib"){openLib=openLib===t.getAttribute("data-id")?null:t.getAttribute("data-id");draw()}
  else if(a==="gdel"){dropGame(t.getAttribute("data-id"),t.getAttribute("data-g"))}
  else if(a==="gadd"){
    var b=document.querySelector('[data-a="gin"][data-id="'+t.getAttribute("data-id")+'"]');
    if(b&&b.value.trim())addGames(t.getAttribute("data-id"),b.value);
  }
  else if(a==="madd"){addMember()}
  else if(a==="wipe"){reset()}
});
app.addEventListener("input",function(e){
  var t=e.target.closest('[data-a="q"]');if(t){q=t.value;draw()}
});
app.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var t=e.target.closest('[data-a="gin"]');
  if(t&&t.value.trim()){e.preventDefault();addGames(t.getAttribute("data-id"),t.value)}
});
app.addEventListener("change",function(e){
  var t=e.target.closest('[data-a="rn"]');if(t)rename(t.getAttribute("data-id"),t.value.trim());
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&sheet){sheet=null;draw();return}
  if(e.key==="/"&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    var b=document.getElementById("qbox");if(b){e.preventDefault();b.focus()}
  }
});

/* ---------- boot ---------- */
(async function(){
  if(!live()){
    sync="local";
    try{var v=localStorage.getItem(LOCAL);S=v?normalize(JSON.parse(v)):seed()}catch(e){S=seed()}
    draw();return;
  }
  try{S=await pull();sync="ok"}catch(e){S=seed();sync="err"}
  draw();
  setInterval(poll,6000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)poll()});
})();
})();
</script>
</body>
</html>
